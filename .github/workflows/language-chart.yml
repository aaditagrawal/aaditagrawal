name: Language chart

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-language-chart.mjs'
      - 'data/extra-languages.json'
      - '.github/workflows/language-chart.yml'

permissions:
  contents: write

concurrency:
  group: language-chart
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate chart
        env:
          # LANG_STATS_TOKEN is a fine-grained PAT with read access to private
          # repos. Without it the run still succeeds, but private repos drop out
          # of the numbers, because GITHUB_TOKEN only sees this repository.
          GITHUB_TOKEN: ${{ secrets.LANG_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/generate-language-chart.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change in the language mix."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data
          git commit -m "chore: refresh language mix chart"
          git push
